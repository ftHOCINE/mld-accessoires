<section id="location" class="py-16 md:py-24 bg-dark-900 scroll-mt-20">
  <div class="container-app">
    <div class="flex flex-col items-center text-center">
      <span class="badge bg-primary-100 text-primary-700">Service 1</span>
      <h2 class="section-title mt-4">Location de Voitures</h2>
      <p class="section-subtitle text-center">
        Une flotte variée de véhicules récents, entretenus et prêts à prendre la route.
        Réservez en quelques secondes directement sur WhatsApp.
      </p>
    </div>

    <!-- Filters -->
    <div class="mt-10 flex flex-wrap items-center justify-center gap-3 bg-dark-800 border border-dark-700 rounded-2xl p-4">
      <div class="flex flex-col">
        <label class="text-xs font-medium text-slate-400 mb-1">Catégorie</label>
        <select
          [(ngModel)]="selectedCategory"
          (ngModelChange)="applyFilters()"
          class="rounded-lg bg-dark-900 border-dark-700 text-slate-200 text-sm focus:border-primary-500 focus:ring-primary-500"
        >
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-xs font-medium text-slate-400 mb-1">Prix maximum / jour</label>
        <select
          [(ngModel)]="selectedMaxPrice"
          (ngModelChange)="applyFilters()"
          class="rounded-lg bg-dark-900 border-dark-700 text-slate-200 text-sm focus:border-primary-500 focus:ring-primary-500"
        >
          <option [ngValue]="0">Tous les prix</option>
          @for (price of maxPriceOptions; track price) {
            <option [ngValue]="price">Jusqu'à {{ price | number }} DA</option>
          }
        </select>
      </div>

      <button type="button" (click)="resetFilters()" class="btn-outline text-sm !px-4 !py-2 self-end">
        Réinitialiser
      </button>
    </div>

    <!-- Cars grid -->
    @if (cars.length > 0) {
      <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (car of cars; track car.id) {
          <app-car-card [car]="car" />
        }
      </div>
    } @else {
      <p class="mt-10 text-center text-slate-400">Aucun véhicule ne correspond à ces critères.</p>
    }
  </div>
</section>
