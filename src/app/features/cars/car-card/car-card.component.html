<article class="card flex flex-col h-full">
  <div class="relative">
    <img [src]="car.imageUrl" [alt]="car.brand + ' ' + car.model" class="h-48 w-full object-cover" loading="lazy" />
    <span
      class="badge absolute top-3 left-3"
      [ngClass]="car.available ? 'bg-green-900/60 text-green-300' : 'bg-red-900/60 text-red-300'"
    >
      {{ car.available ? 'Disponible' : 'Indisponible' }}
    </span>
    <span class="badge absolute top-3 right-3 bg-dark-900/80 text-white">{{ car.category }}</span>
  </div>

  <div class="p-5 flex flex-col flex-1">
    <h3 class="text-lg font-bold text-white">{{ car.brand }} {{ car.model }}</h3>
    <p class="text-sm text-slate-400 mt-1">{{ car.description }}</p>

    <div class="mt-4 grid grid-cols-2 gap-2 text-sm text-slate-300">
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
        </svg>
        {{ car.transmission }}
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        {{ car.fuel }}
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="h-4 w-4 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-3.13a4 4 0 10-4-4 4 4 0 004 4zm6 0a4 4 0 10-4-4" />
        </svg>
        {{ car.seats }} places
      </div>
    </div>

    <div class="mt-5 pt-4 border-t border-dark-700 flex items-center justify-between">
      <div>
        <p class="text-xl font-extrabold text-white">{{ car.pricePerDay | number }} DA</p>
        <p class="text-xs text-slate-400">par jour</p>
      </div>
      <a
        [href]="reserveLink"
        target="_blank"
        rel="noopener"
        class="btn-whatsapp text-sm !px-4 !py-2"
        [class.pointer-events-none]="!car.available"
        [class.opacity-50]="!car.available"
      >
        Réserver
      </a>
    </div>
  </div>
</article>
