<article class="card flex flex-col h-full">
  <div class="relative">
    <img [src]="part.imageUrl" [alt]="part.name" class="h-40 w-full object-cover" loading="lazy" />
    @if (part.installationAvailable) {
      <span class="badge absolute top-3 left-3 bg-primary-100 text-primary-700">Montage inclus</span>
    }
  </div>

  <div class="p-5 flex flex-col flex-1">
    <span class="text-xs font-semibold text-primary-600 uppercase tracking-wide">{{ part.category }}</span>
    <h3 class="text-base font-bold text-dark-900 mt-1">{{ part.name }}</h3>
    @if (part.description) {
      <p class="text-sm text-slate-500 mt-1 flex-1">{{ part.description }}</p>
    }

    <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
      <p class="text-lg font-extrabold text-dark-900">{{ part.price | number }} DA</p>
      <a [href]="availabilityLink" target="_blank" rel="noopener" class="btn-whatsapp text-xs !px-3 !py-2">
        Disponibilité
      </a>
    </div>
  </div>
</article>
