<header class="sticky top-0 z-50 bg-dark-900/95 backdrop-blur border-b border-white/10 shadow-sm">
  <div class="container-app">
    <div class="flex items-center justify-between h-16 md:h-20">
      <!-- Logo -->
      <a href="#accueil" class="flex items-center gap-2 shrink-0" (click)="closeMenu()">
        <img src="logo.png" alt="MLD Accessoires" class="h-12 w-12 object-contain" />
        <div class="leading-tight">
          <p class="font-extrabold text-lg text-white tracking-tight">MLD ACCESSOIRES</p>
          <p class="text-[11px] text-slate-400 hidden sm:block">Location & Pièces Auto</p>
        </div>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden lg:flex items-center gap-8">
        @for (link of navLinks; track link.fragment) {
          <a
            [href]="'#' + link.fragment"
            class="text-sm font-medium text-slate-300 hover:text-primary-500 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Desktop actions -->
      <div class="hidden lg:flex items-center gap-3">
        <a [href]="store.getCallLink()" class="btn-outline !px-4 !py-2 text-sm">
          Appeler
        </a>
        <a
          [href]="store.getWhatsappLink('Bonjour MLD Accessoires, je souhaite avoir des informations.')"
          target="_blank"
          rel="noopener"
          class="btn-whatsapp !px-4 !py-2 text-sm"
        >
          WhatsApp
        </a>
      </div>

      <!-- Mobile burger -->
      <button
        type="button"
        class="lg:hidden inline-flex items-center justify-center h-10 w-10 rounded-lg text-white hover:bg-white/10"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Ouvrir le menu"
      >
        @if (!isMenuOpen) {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (isMenuOpen) {
    <div class="lg:hidden border-t border-white/10 bg-dark-900">
      <nav class="container-app py-4 flex flex-col gap-1">
        @for (link of navLinks; track link.fragment) {
          <a
            [href]="'#' + link.fragment"
            (click)="closeMenu()"
            class="px-3 py-3 rounded-lg text-base font-medium text-slate-300 hover:bg-white/5 hover:text-primary-500"
          >
            {{ link.label }}
          </a>
        }
        <div class="flex gap-3 mt-3 px-3">
          <a [href]="store.getCallLink()" class="btn-outline flex-1 text-sm">Appeler</a>
          <a
            [href]="store.getWhatsappLink('Bonjour MLD Accessoires, je souhaite avoir des informations.')"
            target="_blank"
            rel="noopener"
            class="btn-whatsapp flex-1 text-sm"
          >
            WhatsApp
          </a>
        </div>
      </nav>
    </div>
  }
</header>
